{% extends "base.html" %}

{% block title %}Configurações Gerais{% endblock %}

{% block content %}
<div class="mb-8 flex justify-between items-center">
    <div>
        <h1 class="text-2xl font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-gear text-amber-400"></i> Configurações da Loja
        </h1>
        <p class="text-gray-400 text-sm">Personalize o nome da loja, mensagens do bot e IDs dos canais no Discord.</p>
    </div>
</div>

<div class="bg-gray-800 border border-gray-700 rounded-xl p-6 max-w-3xl">
    <form action="/settings/save" method="POST" class="space-y-4">
        <div>
            <label class="block text-xs font-semibold text-gray-400 mb-1">Nome da Loja</label>
            <input type="text" name="store_name" value="{{ settings.store_name }}" required class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
        </div>
        <div>
            <label class="block text-xs font-semibold text-gray-400 mb-1">URL da Logo / Banner</label>
            <input type="url" name="logo_url" value="{{ settings.logo_url }}" required class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1">ID do Canal de Suporte (Discord)</label>
                <input type="text" name="support_channel_id" value="{{ settings.support_channel_id }}" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1">ID do Cargo de Admin (Discord)</label>
                <input type="text" name="admin_role_id" value="{{ settings.admin_role_id }}" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
            </div>
        </div>
        <div>
            <label class="block text-xs font-semibold text-gray-400 mb-1">Mensagem de Boas-Vindas do Bot</label>
            <textarea name="bot_welcome_message" required class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-amber-500 h-24">{{ settings.bot_welcome_message }}</textarea>
        </div>
        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-gray-900 font-bold py-2.5 rounded-lg transition">
            Salvar Configurações
        </button>
    </form>
</div>
{% endblock %}
